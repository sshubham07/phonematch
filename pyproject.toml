[project]
name = "phonematch"
version = "0.1.0"
description = "Recommends the top 5 phones for a user's budget and needs, grounded in YouTube reviews."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pgvector>=0.5.0",
    "pydantic>=2",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2",
    "uvicorn[standard]>=0.53.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["app", "config", "jobs", "tests"]

[tool.ruff.lint.per-file-ignores]
"app/db/alembic/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-m 'not llm and not network'"
markers = [
    "llm: talks to a real local Ollama (skipped by default)",
    "network: talks to an external network service (skipped by default)",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]
