# Infrastructure dependencies for local development. Python processes (API, jobs, UI) and Ollama
# run natively; add further infra services here as new blocks under `services:`.
name: phonematch

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-phonematch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-phonematch}
      POSTGRES_DB: ${POSTGRES_DB:-phonematch}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
